# Mantém a máquina do Fly ACORDADA no horário de uso (08:00–22:00 BRT).
#
# POR QUE EXISTE: a máquina dorme com `min_machines_running = 0`, e o primeiro
# acesso depois disso paga o arranque — 700 a 930 ms só de TTFB, medido em
# 16/09/2026. Quem chega pelo Google no meio do dia pagava essa conta.
#
# COMO: o Fly Proxy decide o autostop por TRÁFEGO, e uma requisição externa
# acorda a máquina (o monitor.yml deste mesmo repositório já se apoiava nisso).
# Então basta bater na porta enquanto o horário for de gente acordada.
#
# FORA DO HORÁRIO NADA MUDA: das 22h às 8h ninguém pinga, a máquina dorme como
# hoje e acorda sozinha se alguém acessar (`auto_start_machines = true`).
#
# CUSTO: ~14 h/dia de máquina de pé. Com CUSTO_MAQUINA_HORA = 0,00266 dá
# ~US$ 1,12/mês de compute, contra ~US$ 0,30 do monitor de 30 min e ~US$ 1,94 se
# ela ficasse ligada 24 h. Para desligar isto, apague este arquivo.
#
# O HORÁRIO É EM UTC porque o cron do GitHub é UTC, e o Brasil não tem mais
# horário de verão desde 2019 — então BRT = UTC-3 fixo, sem exceção no ano:
#   08:00 BRT = 11:00 UTC   ·   22:00 BRT = 01:00 UTC (do dia seguinte)
#
# UMA RESSALVA HONESTA: o cron do GitHub é "melhor esforço" e atrasa em horário
# de pico. O intervalo de 30 min aqui é só o GATILHO de acordar; quem mantém a
# máquina de pé entre os gatilhos é o auto-ping do próprio servidor (ver
# manterAcordado no servidor.js), que só roda dentro da mesma janela.

name: Manter acordado

on:
  schedule:
    # das 11:00 às 23:30 UTC = 08:00 às 20:30 BRT
    - cron: "*/30 11-23 * * *"
    # 00:00 e 00:30 UTC = 21:00 e 21:30 BRT (fecha a janela às 22h)
    - cron: "0,30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acordar:
    runs-on: ubuntu-latest
    steps:
      - name: Bater na porta (acorda a máquina se ela estiver dormindo)
        run: |
          # Timeout generoso: com a máquina dormindo o primeiro pedido leva ~6 s.
          # Aqui não há alarme — se falhar, o monitor.yml é quem avisa.
          CODIGO=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://climb.dev.br/api/saude" || echo "000")
          echo "resposta: $CODIGO"
          if [ "$CODIGO" = "200" ]; then
            echo "máquina de pé."
          else
            echo "não respondeu 200 — o monitor.yml cuida do alarme."
          fi
